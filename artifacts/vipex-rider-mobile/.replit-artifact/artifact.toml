kind = "mobile"
previewPath = "/vipex-rider-mobile/"
title = "VIPEX Rider Mobile"
description = "A native Expo rider app for VIPEX Parcel Delivery, giving Ghanaian couriers a focused mobile workspace for active deliveries, earnings, rider status, and Mobile Money subscription activation."
version = "1.0.0"
id = "artifacts/vipex-rider-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/vipex-rider-mobile/" ]
localPort = 26026

[services.development]
run = "pnpm --filter @workspace/vipex-rider-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vipex-rider-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/vipex-rider-mobile", "run", "serve" ]

[services.env]
PORT = "26026"
BASE_PATH = "/vipex-rider-mobile/"
