kind = "web"
previewPath = "/"
title = "VIPEX Rider"
description = "A mobile-first rider dashboard for VIPEX Parcel Delivery, helping Ghanaian riders track active deliveries, view earnings, and manage their workday from one focused app."
version = "1.0.0"
id = "artifacts/vipex-rider"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23674

[services.development]
run = "pnpm --filter @workspace/vipex-rider run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vipex-rider", "run", "build" ]
serve = "static"
publicDir = "artifacts/vipex-rider/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23674"
BASE_PATH = "/"
